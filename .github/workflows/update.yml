# Refresh data/games/*.csv from the CollegeBasketballData API and the women's
# files (data/women/) from ESPN, commit them, rebuild collegebasketballbelt.com
# (men's belt at /, women's at /women/) and deploy it to GitHub Pages.
# The first run with no data backfills every season; later runs make one or
# two API calls each. Run by hand with "full" ticked to redo the backfill.
name: Update and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Full backfill (every season, a few hundred API calls)"
        type: boolean
        default: false
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch games
        if: github.event_name != 'push'
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python fetch_games.py ${{ inputs.full && '--full' || '' }}
        continue-on-error: true
      - name: Fetch women's games (ESPN via wehoop + ESPN scoreboard, no key)
        if: github.event_name != 'push'
        run: python fetch_women.py
        continue-on-error: true
      - name: Fetch AP polls
        if: github.event_name != 'push'
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python fetch_polls.py
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && echo "no data changes" && exit 0
          git commit -m "Update game data [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
      - name: Build lineage
        run: python build_lineage.py
      - name: Preview extras (ESPN, weather, AI preview)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python enrich_preview.py
        continue-on-error: true
      - name: Commit preview data
        run: |
          git add -A data
          git diff --cached --quiet && echo "no preview changes" && exit 0
          git commit -m "Update preview data [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && break; git rebase --abort 2>/dev/null; sleep $((i * 7)); done
        continue-on-error: true
      - name: Build site
        run: python build_site.py
      - name: Share image
        run: pip install pillow && python og_images.py || cp site/og.png site/og-holder.png
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Ping IndexNow (Bing, DuckDuckGo, Yahoo, Yandex) with the pages that changed
        # indexnow.py wrote indexnow-changed.json and the key file during the build. Read the list
        # back from the live site (which also proves the deploy propagated) and POST it once.
        # Google ignores IndexNow and reads the sitemap. Never fails the deploy.
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import json, time, urllib.request, urllib.error
          src = "https://collegebasketballbelt.com/indexnow-changed.json"
          payload = None
          for attempt in range(8):
              try:
                  with urllib.request.urlopen(f"{src}?t={int(time.time())}", timeout=30) as r:
                      payload = json.load(r)
                  break
              except Exception as e:
                  print(f"waiting for the deploy to propagate ({e})")
                  time.sleep(20)
          urls = (payload or {}).get("urlList") or []
          if not urls:
              print("IndexNow: nothing to submit")
              raise SystemExit(0)
          body = json.dumps({k: payload[k] for k in ("host", "key", "keyLocation", "urlList")}).encode("utf-8")
          req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                       headers={"Content-Type": "application/json; charset=utf-8"})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  print(f"IndexNow: HTTP {r.status} -- {len(urls)} changed URLs submitted")
          except urllib.error.HTTPError as e:
              print(f"IndexNow: HTTP {e.code} {e.read()[:200]!r} -- not fatal")
          except Exception as e:
              print(f"IndexNow: {e} -- not fatal")
          EOF

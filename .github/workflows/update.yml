# Refresh data/games/*.csv from the CollegeBasketballData API, commit it,
# rebuild collegebasketballbelt.com and deploy it to GitHub Pages.
# The first run with no data backfills every season; later runs make one or
# two API calls each. Run by hand with "full" ticked to redo the backfill.
name: Update and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: "Full backfill (every season, a few hundred API calls)"
        type: boolean
        default: false
  schedule:
    - cron: "41 */3 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch games
        if: github.event_name != 'push'
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python fetch_games.py ${{ inputs.full && '--full' || '' }}
        continue-on-error: true
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && echo "no data changes" && exit 0
          git commit -m "Update game data [skip ci]"
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep $((i * 7)); done
      - name: Build lineage
        run: python build_lineage.py
      - name: Preview extras (ESPN, weather, AI preview)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python enrich_preview.py
        continue-on-error: true
      - name: Commit preview data
        run: |
          git add -A data
          git diff --cached --quiet && echo "no preview changes" && exit 0
          git commit -m "Update preview data [skip ci]"
          for i in 1 2 3 4; do git pull --rebase && git push && break; sleep $((i * 7)); done
        continue-on-error: true
      - name: Build site
        run: python build_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Check CBBD key
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe the College Basketball Data API
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
        run: python check_cbbd.py
